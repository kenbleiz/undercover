services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: undercover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undercover}
      POSTGRES_DB: undercover
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undercover -d undercover"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - undercover

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      VITE_AUTH_ENABLED: "false"
      DATABASE_URL: postgres://undercover:${POSTGRES_PASSWORD:-undercover}@db:5432/undercover?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - undercover

  nginx:
    build:
      context: ./docker/nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - undercover

volumes:
  pgdata:

networks:
  undercover:
    driver: bridge
